name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - run: dotnet run --project tests/CheckupEngineTests.csproj --nologo
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Test-Release.ps1
      - shell: pwsh
        run: Compress-Archive -Path test-output\* -DestinationPath Checkup-${{ github.ref_name }}-win-x64.zip
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: Checkup-${{ github.ref_name }}-win-x64.zip
